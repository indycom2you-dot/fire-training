<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงทะเบียนสัมมนา - เมืองใกล้จม... รับมือวิกฤตน้ำท่วม</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .menu-card { transition: all 0.2s ease; cursor: pointer; }
        .menu-card:active { transform: scale(0.95); }
        .menu-selected { border-color: #ef4444; background-color: #fef2f2; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ExcelJS & FileSaver for Admin Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="antialiased text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC9-6NepYeoyU4-pluImdIcNBV6H7ThLas",
            authDomain: "ppp-registration.firebaseapp.com",
            projectId: "ppp-registration",
            storageBucket: "ppp-registration.firebasestorage.app",
            messagingSenderId: "1072711188640",
            appId: "1:1072711188640:web:e639ef36b32ea637ab09c5",
            measurementId: "G-Z0XFPK8CJ7"
        };

        // ชื่อ Collection ใหม่สำหรับงานน้ำท่วมโดยเฉพาะ
        const DB_COLLECTION = 'registrations_flood_2026';

        const MENU_DATA = {
            bakery: [
                { id: 'b1', name: 'เค้กช็อกโกแลตหน้านิ่ม', icon: '🍰' },
                { id: 'b2', name: 'บราวนี่มัทฉะ', icon: '🥮' },
                { id: 'b3', name: 'ครัวซองต์เนยสด', icon: '🥐' },
                { id: 'b4', name: 'แซนวิชแฮมชีส', icon: '🥪' },
                { id: 'b5', name: 'ทาร์ตผลไม้', icon: '🥧' },
                { id: 'b6', name: 'คุกกี้เนยสด', icon: '🍪' }
            ],
            drinks: [
                { id: 'd1', name: 'อเมริกาโน่ (เย็น)', icon: '☕' },
                { id: 'd2', name: 'ลาเต้ (เย็น)', icon: '🥛' },
                { id: 'd3', name: 'ชาเขียวมัทฉะ (เย็น)', icon: '🍵' },
                { id: 'd4', name: 'ชาไทย (เย็น)', icon: '🧋' },
                { id: 'd5', name: 'โกโก้ (เย็น)', icon: '🍫' },
                { id: 'd6', name: 'น้ำส้มคั้นสด', icon: '🍊' },
                { id: 'd7', name: 'อิตาเลียนโซดาสตรอว์เบอร์รี', icon: '🍓' }
            ]
        };

        const App = () => {
            const [view, setView] = React.useState('form'); // form, login, admin
            const [step, setStep] = React.useState(1); // 1: Info Page, 2: Form Page (ระบบ 2 หน้า)
            const [user, setUser] = React.useState(null);
            const [registrations, setRegistrations] = React.useState([]);
            
            // Form State
            const [formData, setFormData] = React.useState({
                name: '', company: '', phone: '', attendance: 'เข้าร่วม',
                bakery: '', drink: ''
            });
            const [loading, setLoading] = React.useState(false);
            const [submitted, setSubmitted] = React.useState(false);
            const [errorMsg, setErrorMsg] = React.useState('');
            
            // Login State
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');

            React.useEffect(() => {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                const auth = firebase.auth();
                const db = firebase.firestore();

                const initAuth = async () => {
                    if (!auth.currentUser) {
                        try { await auth.signInAnonymously(); } 
                        catch(e) { console.error("Auth Error:", e); }
                    }
                };
                initAuth();

                let unsubscribeData = null;
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (unsubscribeData) { unsubscribeData(); unsubscribeData = null; }
                    
                    if (u && !u.isAnonymous) {
                        setView('admin');
                        unsubscribeData = db.collection(DB_COLLECTION)
                            .onSnapshot((snapshot) => {
                                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                                setRegistrations(items);
                            });
                    }
                });

                return () => {
                    unsubscribeAuth();
                    if (unsubscribeData) unsubscribeData();
                };
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                // Validation: ถ้าเข้าร่วม ต้องเลือกเมนูให้ครบ 2 อย่าง
                if (formData.attendance === 'เข้าร่วม') {
                    if (!formData.bakery || !formData.drink) {
                        setErrorMsg('กรุณาเลือกเบเกอรี่ 1 อย่าง และเครื่องดื่ม 1 อย่าง ให้ครบถ้วนครับ');
                        // เลื่อนลงไปดู error
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                        return;
                    }
                }

                setLoading(true);
                try {
                    const db = firebase.firestore();
                    await db.collection(DB_COLLECTION).add({
                        ...formData,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setSubmitted(true);
                    setFormData({ name: '', company: '', phone: '', attendance: 'เข้าร่วม', bakery: '', drink: '' });
                    setStep(1); // Reset กลับหน้าแรกเผื่อลงทะเบียนใหม่
                } catch (err) {
                    setErrorMsg("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้งครับ");
                }
                setLoading(false);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                try {
                    const loginEmail = username.includes('@') ? username : `${username}@ppp.com`;
                    await firebase.auth().signInWithEmailAndPassword(loginEmail, password);
                } catch (err) {
                    setErrorMsg("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้องครับ");
                }
                setLoading(false);
            };

            const handleLogout = async () => {
                await firebase.auth().signOut();
                setView('form');
                setUsername(''); setPassword(''); setErrorMsg('');
            };

            const handleDelete = async (id) => {
                try {
                    await firebase.firestore().collection(DB_COLLECTION).doc(id).delete();
                } catch (err) {
                    console.error("Delete failed", err);
                }
            };

            const exportExcel = async () => {
                const workbook = new ExcelJS.Workbook();
                const sheet = workbook.addWorksheet('รายชื่อผู้ลงทะเบียน');
                
                sheet.columns = [
                    { header: 'ลำดับ', key: 'index', width: 8 },
                    { header: 'ชื่อ-นามสกุล', key: 'name', width: 30 },
                    { header: 'บริษัท/หน่วยงาน', key: 'company', width: 35 },
                    { header: 'เบอร์โทรศัพท์', key: 'phone', width: 15 },
                    { header: 'สถานะ', key: 'attendance', width: 15 },
                    { header: 'เบเกอรี่', key: 'bakery', width: 25 },
                    { header: 'เครื่องดื่ม', key: 'drink', width: 25 },
                    { header: 'วันที่ลงทะเบียน', key: 'date', width: 20 }
                ];

                sheet.getRow(1).font = { name: 'Sarabun', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
                sheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDC2626' } };
                sheet.getRow(1).alignment = { vertical: 'middle', horizontal: 'center' };

                registrations.forEach((r, i) => {
                    const row = sheet.addRow({
                        index: i + 1,
                        name: r.name,
                        company: r.company,
                        phone: r.phone,
                        attendance: r.attendance,
                        bakery: r.bakery || '-',
                        drink: r.drink || '-',
                        date: r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleString('th-TH') : '-'
                    });
                    row.font = { name: 'Sarabun', size: 11 };
                    if (i % 2 === 1) row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                saveAs(blob, `รายชื่อลงทะเบียน_น้ำท่วม_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            if (view === 'form') {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 px-4 sm:px-6">
                        <div className="w-full max-w-xl relative">
                            {submitted ? (
                                <div className="bg-white p-10 rounded-[32px] shadow-2xl text-center border border-slate-100 animate-in zoom-in duration-500 mt-10">
                                    <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner">✅</div>
                                    <h2 className="text-2xl font-black mb-3 text-slate-800">ลงทะเบียนสำเร็จ!</h2>
                                    <p className="text-slate-600 mb-8 leading-relaxed">ระบบได้รับข้อมูลของท่านเรียบร้อยแล้ว<br/>รอพบกันในวันงานสัมมนานะครับ</p>
                                    <button onClick={() => setSubmitted(false)} className="w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-2xl font-bold transition-all shadow-lg shadow-red-200">
                                        กลับหน้าหลัก
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-white rounded-[32px] shadow-2xl overflow-hidden border border-slate-100 relative min-h-[600px]">
                                    
                                    {/* หน้า 1: รายละเอียดงานสัมมนา */}
                                    {step === 1 && (
                                        <div className="animate-in fade-in slide-in-from-left-4 duration-300">
                                            {/* Cover Image */}
                                            <div className="w-full relative bg-slate-900">
                                                <img 
                                                    src="./ปก.png" 
                                                    alt="Cover" 
                                                    className="w-full h-auto object-cover"
                                                    onError={(e) => {
                                                        e.target.onerror = null;
                                                        e.target.src = "https://placehold.co/800x450/1e293b/ffffff?text=เมืองใกล้จม...+รับมือวิกฤตน้ำท่วม";
                                                    }}
                                                />
                                            </div>
                                            
                                            <div className="p-6 md:p-10">
                                                {/* Event Details */}
                                                <div className="space-y-4 mb-8">
                                                    <div className="flex items-start gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                                        <div className="w-10 h-10 shrink-0 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl">🗓️</div>
                                                        <div className="pt-1 w-full">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="font-bold text-slate-800 text-sm">วันที่จัดงาน</span>
                                                            </div>
                                                            <div className="text-slate-600 font-medium">14 สิงหาคม 2569</div>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex items-start gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                                        <div className="w-10 h-10 shrink-0 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-xl">⏰</div>
                                                        <div className="pt-1">
                                                            <div className="font-bold text-slate-800 text-sm mb-1">กำหนดการ</div>
                                                            <div className="text-slate-600 font-medium flex flex-col gap-1">
                                                                <span>ลงทะเบียน 14.00 น.</span>
                                                                <span className="text-red-600 font-bold">เริ่มประชุม 14.30 น.</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-start gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                                        <div className="w-10 h-10 shrink-0 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl">📍</div>
                                                        <div className="pt-1">
                                                            <div className="font-bold text-slate-800 text-sm mb-1">สถานที่</div>
                                                            <div className="text-slate-600 font-medium">ร้าน ณ คุณ</div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-start gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                                        <div className="w-10 h-10 shrink-0 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl">🎤</div>
                                                        <div className="pt-1">
                                                            <div className="font-bold text-slate-800 text-sm mb-1">วิทยากร</div>
                                                            <div className="text-slate-600 font-medium">
                                                                ผู้จัดการ สาขาหาดใหญ่<br/>
                                                                <span className="text-xs text-slate-400">บริษัท กรุงเทพพานิชประกันภัย จำกัด (มหาชน)</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <button onClick={() => setStep(2)} className="w-full py-5 bg-[#dc2626] text-white rounded-2xl font-black text-lg shadow-xl shadow-red-600/30 hover:bg-red-700 hover:-translate-y-1 transition-all flex items-center justify-center gap-2">
                                                    กรอกข้อมูลลงทะเบียน 👉
                                                </button>

                                                <div className="mt-8 text-center">
                                                    <button onClick={() => setView('login')} className="text-slate-300 hover:text-red-500 text-[10px] tracking-widest uppercase font-bold transition-colors">
                                                        Admin Dashboard
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* หน้า 2: ฟอร์มกรอกข้อมูล */}
                                    {step === 2 && (
                                        <div className="animate-in fade-in slide-in-from-right-4 duration-300 bg-white">
                                            <div className="p-6 md:p-10">
                                                
                                                {/* Header & Back Button */}
                                                <div className="flex items-center gap-4 mb-8 border-b border-slate-100 pb-4">
                                                    <button type="button" onClick={() => { setStep(1); setErrorMsg(''); }} className="w-10 h-10 shrink-0 bg-slate-50 hover:bg-slate-100 text-slate-500 hover:text-red-600 rounded-full flex items-center justify-center font-black transition-all shadow-sm border border-slate-200">
                                                        ←
                                                    </button>
                                                    <div>
                                                        <h2 className="text-xl md:text-2xl font-black text-slate-800">ฟอร์มลงทะเบียน</h2>
                                                        <p className="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">เมืองใกล้จม... รับมือวิกฤตน้ำท่วม</p>
                                                    </div>
                                                </div>

                                                {/* Registration Form */}
                                                <form onSubmit={handleSubmit} className="space-y-6">
                                                    <div>
                                                        <label className="block text-sm font-bold text-slate-700 mb-2 ml-1">ชื่อ - นามสกุล <span className="text-red-500">*</span></label>
                                                        <input type="text" required placeholder="กรอกชื่อและนามสกุล" className="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium text-slate-700" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-bold text-slate-700 mb-2 ml-1">บริษัท / โบรคเกอร์ <span className="text-red-500">*</span></label>
                                                        <input type="text" required placeholder="กรอกชื่อบริษัท หรือ ต้นสังกัด" className="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium text-slate-700" value={formData.company} onChange={e => setFormData({...formData, company: e.target.value})} />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-bold text-slate-700 mb-2 ml-1">เบอร์โทรศัพท์ <span className="text-red-500">*</span></label>
                                                        <input type="tel" required placeholder="08X-XXX-XXXX" className="w-full px-5 py-4 rounded-2xl bg-white border border-slate-200 outline-none focus:ring-2 focus:ring-red-500 transition-all font-medium text-slate-700" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
                                                    </div>

                                                    <div className="pt-4">
                                                        <label className="block text-sm font-bold text-slate-700 mb-3 ml-1">สถานะการเข้าร่วม <span className="text-red-500">*</span></label>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <button type="button" onClick={() => setFormData({...formData, attendance: 'เข้าร่วม'})} className={`py-4 rounded-2xl font-bold border-2 transition-all flex flex-col items-center justify-center gap-1 ${formData.attendance === 'เข้าร่วม' ? 'bg-red-50 border-red-500 text-red-600 shadow-sm' : 'bg-white border-slate-200 text-slate-400 hover:border-red-200'}`}>
                                                                <span className="text-2xl">🙋‍♂️</span> เข้าร่วม
                                                            </button>
                                                            <button type="button" onClick={() => setFormData({...formData, attendance: 'ไม่เข้าร่วม', bakery: '', drink: ''})} className={`py-4 rounded-2xl font-bold border-2 transition-all flex flex-col items-center justify-center gap-1 ${formData.attendance === 'ไม่เข้าร่วม' ? 'bg-slate-100 border-slate-400 text-slate-600 shadow-sm' : 'bg-white border-slate-200 text-slate-400 hover:border-slate-300'}`}>
                                                                <span className="text-2xl">❌</span> ไม่เข้าร่วม
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Menu Selection (Only if attending) */}
                                                    {formData.attendance === 'เข้าร่วม' && (
                                                        <div className="pt-6 pb-2 animate-in fade-in slide-in-from-top-4 duration-500">
                                                            <div className="bg-amber-50 border border-amber-200 rounded-[24px] p-6 mb-6">
                                                                <h3 className="text-lg font-black text-amber-800 mb-1">เลือกเมนูอาหารว่าง 🍽️</h3>
                                                                <p className="text-xs text-amber-600 mb-6 font-medium">กรุณาเลือกเบเกอรี่ 1 อย่าง และเครื่องดื่ม 1 อย่าง</p>
                                                                
                                                                {/* Bakery Selection */}
                                                                <div className="mb-8">
                                                                    <div className="flex items-center justify-between mb-3">
                                                                        <h4 className="font-bold text-slate-700 text-sm">1. เลือกเบเกอรี่ <span className="text-red-500">*</span></h4>
                                                                        {formData.bakery && <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold shadow-sm">✓ เลือกแล้ว</span>}
                                                                    </div>
                                                                    <div className="grid grid-cols-2 gap-3">
                                                                        {MENU_DATA.bakery.map(item => (
                                                                            <div 
                                                                                key={item.id} 
                                                                                onClick={() => setFormData({...formData, bakery: item.name})}
                                                                                className={`menu-card border-2 rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2 ${formData.bakery === item.name ? 'menu-selected' : 'border-slate-200 bg-white hover:border-red-200'}`}
                                                                            >
                                                                                <span className="text-3xl">{item.icon}</span>
                                                                                <span className={`text-xs font-bold leading-tight ${formData.bakery === item.name ? 'text-red-700' : 'text-slate-600'}`}>{item.name}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>

                                                                {/* Mobile Scroll Indicator (Bounce) */}
                                                                <div className="md:hidden flex flex-col items-center justify-center py-4 my-2 border-y border-amber-200/50">
                                                                    <span className="text-amber-500 animate-bounce text-xl">👇</span>
                                                                    <span className="text-[11px] font-bold text-amber-700 mt-1">เลื่อนลงเพื่อเลือกเครื่องดื่ม</span>
                                                                </div>

                                                                {/* Drink Selection */}
                                                                <div className="mb-4">
                                                                    <div className="flex items-center justify-between mb-3">
                                                                        <h4 className="font-bold text-slate-700 text-sm">2. เลือกเครื่องดื่ม <span className="text-red-500">*</span></h4>
                                                                        {formData.drink && <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold shadow-sm">✓ เลือกแล้ว</span>}
                                                                    </div>
                                                                    <div className="grid grid-cols-2 gap-3">
                                                                        {MENU_DATA.drinks.map(item => (
                                                                            <div 
                                                                                key={item.id} 
                                                                                onClick={() => setFormData({...formData, drink: item.name})}
                                                                                className={`menu-card border-2 rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2 ${formData.drink === item.name ? 'menu-selected' : 'border-slate-200 bg-white hover:border-red-200'}`}
                                                                            >
                                                                                <span className="text-3xl">{item.icon}</span>
                                                                                <span className={`text-xs font-bold leading-tight ${formData.drink === item.name ? 'text-red-700' : 'text-slate-600'}`}>{item.name}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>

                                                                {/* Summary Status in Menu Box */}
                                                                <div className="mt-6 text-center">
                                                                    {formData.bakery && formData.drink ? (
                                                                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-full text-xs font-bold shadow-sm border border-green-200">
                                                                            <span>✅</span> เลือกเมนูครบถ้วนแล้ว
                                                                        </div>
                                                                    ) : (
                                                                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-amber-100/50 text-amber-600 rounded-full text-xs font-bold">
                                                                            <span>⚠️</span> กรุณาเลือกให้ครบ 2 อย่าง
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Error Message Display */}
                                                    {errorMsg && (
                                                        <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold text-center border border-red-200 animate-pulse">
                                                            ⚠️ {errorMsg}
                                                        </div>
                                                    )}

                                                    <button type="submit" disabled={loading} className="w-full py-5 bg-[#dc2626] text-white rounded-2xl font-black text-lg shadow-xl shadow-red-600/30 hover:bg-red-700 hover:-translate-y-1 transition-all flex items-center justify-center gap-2 mt-4">
                                                        {loading ? <span className="w-6 h-6 border-4 border-white/30 border-t-white rounded-full animate-spin"></span> : "ยืนยันการลงทะเบียน"}
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                        <div className="w-full max-w-sm bg-white p-8 rounded-[32px] shadow-2xl">
                            <div className="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl">🔐</div>
                            <h2 className="text-xl font-black mb-6 text-center text-slate-800">Admin Login</h2>
                            {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold text-center">{errorMsg}</div>}
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <input type="text" placeholder="Username" required className="w-full px-5 py-4 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-red-500 text-sm font-medium" value={username} onChange={e => setUsername(e.target.value)} />
                                <input type="password" placeholder="Password" required className="w-full px-5 py-4 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:border-red-500 text-sm font-medium" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" disabled={loading} className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold transition-all hover:bg-slate-800">{loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ'}</button>
                                <button type="button" onClick={() => {setView('form'); setStep(1); setErrorMsg('');}} className="w-full text-slate-400 hover:text-slate-600 text-sm mt-4 font-medium">← กลับหน้าลงทะเบียน</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (user && !user.isAnonymous && view === 'admin') {
                const total = registrations.length;
                const attending = registrations.filter(r => r.attendance === 'เข้าร่วม').length;
                const notAttending = registrations.filter(r => r.attendance === 'ไม่เข้าร่วม').length;

                return (
                    <div className="min-h-screen bg-slate-50 font-sans pb-12">
                        <nav className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-30 flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-red-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md">P</div>
                                <div>
                                    <h1 className="text-lg font-black text-slate-800 leading-tight">Registration Dashboard</h1>
                                    <p className="text-[11px] text-slate-500 font-bold uppercase mt-0.5">PPP Insurance Broker</p>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="text-sm font-bold text-slate-500 hover:text-red-600 bg-slate-50 px-4 py-2 rounded-lg border border-slate-200">
                                ออกจากระบบ
                            </button>
                        </nav>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
                            <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-black text-slate-800">สรุปยอดผู้ลงทะเบียน</h2>
                                    <p className="text-sm text-slate-500 mt-1 font-medium">งานสัมมนา: เมืองใกล้จม... รับมือวิกฤตน้ำท่วม</p>
                                </div>
                                <button onClick={exportExcel} className="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg shadow-emerald-600/20 w-full md:w-auto">
                                    <span>📥</span> ดาวน์โหลด Excel
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                                    <div>
                                        <p className="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-1">ลงทะเบียนทั้งหมด</p>
                                        <div className="flex items-baseline gap-1"><span className="text-4xl font-black text-slate-800">{total}</span><span className="text-sm font-bold text-slate-400">ท่าน</span></div>
                                    </div>
                                    <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-3xl">👥</div>
                                </div>
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-emerald-50 flex items-center justify-between">
                                    <div>
                                        <p className="text-xs font-extrabold text-emerald-500 uppercase tracking-widest mb-1">เข้าร่วมงาน</p>
                                        <div className="flex items-baseline gap-1"><span className="text-4xl font-black text-emerald-600">{attending}</span><span className="text-sm font-bold text-emerald-400">ท่าน</span></div>
                                    </div>
                                    <div className="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl">✅</div>
                                </div>
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-rose-50 flex items-center justify-between">
                                    <div>
                                        <p className="text-xs font-extrabold text-rose-500 uppercase tracking-widest mb-1">ไม่เข้าร่วม</p>
                                        <div className="flex items-baseline gap-1"><span className="text-4xl font-black text-rose-600">{notAttending}</span><span className="text-sm font-bold text-rose-400">ท่าน</span></div>
                                    </div>
                                    <div className="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-3xl">❌</div>
                                </div>
                            </div>

                            <div className="bg-white rounded-[24px] shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-5 border-b border-slate-100 bg-slate-50">
                                    <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-widest flex items-center gap-2">
                                        <span className="text-lg">📋</span> รายชื่อและข้อมูลเมนูอาหาร
                                    </h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left whitespace-nowrap">
                                        <thead className="bg-white border-b border-slate-200">
                                            <tr>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">ผู้ลงทะเบียน / บริษัท</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">เบอร์โทร</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">สถานะ</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">เมนูอาหารว่าง</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-right">จัดการ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {registrations.map(r => (
                                                <tr key={r.id} className="hover:bg-slate-50 transition-colors group">
                                                    <td className="py-4 px-6">
                                                        <div className="font-bold text-sm text-slate-800">{r.name}</div>
                                                        <div className="text-xs text-slate-500 font-medium">{r.company}</div>
                                                    </td>
                                                    <td className="py-4 px-6 text-center text-sm font-medium text-slate-600">{r.phone}</td>
                                                    <td className="py-4 px-6 text-center">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-bold ${r.attendance === 'เข้าร่วม' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>
                                                            {r.attendance}
                                                        </span>
                                                    </td>
                                                    <td className="py-4 px-6">
                                                        {r.attendance === 'เข้าร่วม' ? (
                                                            <div className="flex flex-col text-xs font-medium text-slate-600 gap-1 items-center">
                                                                <span className="bg-amber-50 px-2 py-0.5 rounded border border-amber-100 text-amber-700">{r.bakery || '-'}</span>
                                                                <span className="bg-blue-50 px-2 py-0.5 rounded border border-blue-100 text-blue-700">{r.drink || '-'}</span>
                                                            </div>
                                                        ) : (
                                                            <div className="text-center text-slate-300 text-sm">-</div>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-6 text-right">
                                                        <button onClick={() => handleDelete(r.id)} className="w-8 h-8 inline-flex items-center justify-center rounded-lg text-slate-300 hover:bg-red-100 hover:text-red-600 transition-all opacity-0 group-hover:opacity-100">
                                                            🗑️
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {registrations.length === 0 && (
                                                <tr><td colSpan="5" className="py-16 text-center text-slate-400 font-bold bg-slate-50/50">ยังไม่มีผู้ลงทะเบียน</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
