    <script type="text/babel">
        // =========================================================

        // แล้วตั้งชื่อไฟล์เป็น cover.png หรือแก้ชื่อไฟล์ตรงบรรทัดด้านล่าง
        // =========================================================

        // แยกผู้ลงทะเบียนแต่ละงาน โดยไม่ลบข้อมูลจากงานก่อน
        const EVENT_ID = "ppp-seminar-2026-11-11";
        // ใช้เฉพาะเมนูเครื่องดื่ม 1 รายการ และคงเงื่อนไขการลงทะเบียนตามงานเดิม
        const ENABLE_FOOD_SELECTION = true;

        // รหัสเชื่อมต่อ FIREBASE 
        const firebaseConfig = {
            apiKey: "AIzaSyC9-6NepYeoyU4-pluImdIcNBV6H7ThLas",
            authDomain: "ppp-registration.firebaseapp.com",
            projectId: "ppp-registration",
            storageBucket: "ppp-registration.firebasestorage.app",
            messagingSenderId: "1072711188640",
            appId: "1:1072711188640:web:e639ef36b32ea637ab09c5",
            measurementId: "G-Z0XFPK8CJ7"
        };

        const menuData = {
            drinks: {
                "☕ หมวดกาแฟ (Coffee)": ["อเมริกาโน", "ลาเต้", "เอสเพรสโซ่", "มอคคา", "คาปูชิโน่", "อเมริกาโน่น้ำผึ้งมะนาว", "อเมริกาโน่น้ำส้ม", "อเมริกาโน่น้ำมะพร้าว"],
                "🍵 หมวดชาและนม": ["ชาไทย", "ชาเขียว", "ชามิกซ์", "โกโก้", "โกโก้พิงค์", "นมชมพู", "นมสดสตรอเบอรี่", "นมสดสตรอเบอรี่ชาไทย", "นมสดสตรอเบอรี่ชาเขียว", "นมสดสตรอเบอรี่โกโก้", "สตรอเบอรี่ลาเต้", "สตรอเบอรี่ช็อคมิ้นท์"],
                "🍓 หมวดสมูทตี้ปั่น": ["สตอเบอรี่สมูทตี้โยเกิร์ต", "สตอเบอรี่สมูทตี้", "มิกซ์เบอรี่สมูทตี้", "อาโวคาโดนมสดน้ำผึ้ง", "แตงโมปั่นไร้น้ำแข็ง", "ลิ้นจี่ปั่น", "เสาวรสสดปั่น"],
                "🍹 หมวดอิตาเลี่ยนโซดา": ["มะนาวน้ำผึ้งโซดา", "บลูเบอรี่โซดา", "ลิ้นจี่โซดา", "เขียวโซดา", "บลูฮาวายโซดา", "แดงโซดา", "สตรอเบอรี่โซดา", "ไม่รับเครื่องดื่ม"]
            }
        };

        const overviewImages = [
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/77775555.png",
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/1778246828831.jpg",
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/1778246840708.jpg",
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/1778246833650.jpg",
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/1778246831082.jpg",
            "https://raw.githubusercontent.com/indycom2you-dot/fire-training/main/1778246825179.jpg"
        ];

        const App = () => {
            const [view, setView] = React.useState('landing'); 
            const [user, setUser] = React.useState(null);
            const [registrations, setRegistrations] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [errorMsg, setErrorMsg] = React.useState('');
            
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');

            const [isMenuSelectorOpen, setIsMenuSelectorOpen] = React.useState(false);
            const [enlargedImage, setEnlargedImage] = React.useState(null);
            const [tempDrink, setTempDrink] = React.useState('');
            const [activeDrinkCategory, setActiveDrinkCategory] = React.useState('ทั้งหมด');
            const [drinkSearch, setDrinkSearch] = React.useState('');
            const [showDrinkPhotos, setShowDrinkPhotos] = React.useState(false);
            const [showTopics, setShowTopics] = React.useState(false);
            const [registrationReceipt, setRegistrationReceipt] = React.useState(null);
            const scrollRef = React.useRef(null);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedIds, setSelectedIds] = React.useState([]);

            const [formData, setFormData] = React.useState({
                name: '', nickname: '', company: '', email: '', phone: '', attendance: 'เข้าร่วม', foodMenu: '', acceptedTerms: false
            });

            // แสดงความคืบหน้าโดยไม่เพิ่ม/เปลี่ยนฟิลด์ของ Firebase
            const phoneValid = /^\d{9,10}$/.test(formData.phone.replace(/[\s-]/g, ''));
            const baseDone = [formData.name.trim(), formData.company.trim(), phoneValid].filter(Boolean).length;
            const needsDrink = formData.attendance === 'เข้าร่วม' && ENABLE_FOOD_SELECTION;
            const formTotal = needsDrink ? 5 : 3;
            const formDone = baseDone + (needsDrink && formData.foodMenu.trim() ? 1 : 0) + (needsDrink && formData.acceptedTerms ? 1 : 0);
            const formPercent = Math.round(formDone / formTotal * 100);
            const visibleDrinkCount = Object.entries(menuData.drinks)
                .filter(([category]) => activeDrinkCategory === 'ทั้งหมด' || activeDrinkCategory === category)
                .reduce((total, [, drinks]) => total + drinks.filter(drink => drink.toLocaleLowerCase('th').includes(drinkSearch.trim().toLocaleLowerCase('th'))).length, 0);

            React.useEffect(() => {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();
                const db = firebase.firestore();

                const initAuth = async () => {
                    if (!auth.currentUser) {
                        try { await auth.signInAnonymously(); } catch(e) { console.error("Auth init error:", e); }
                    }
                };
                initAuth();

                let unsubscribeData = null;
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (unsubscribeData) { unsubscribeData(); unsubscribeData = null; }
                    if (u && !u.isAnonymous) {
                        setView('admin');
                        unsubscribeData = db.collection('registrations')
                            .onSnapshot((snapshot) => {
                                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(r => r.eventId === EVENT_ID);
                                items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                                setRegistrations(items);
                            });
                    } else {
                        setRegistrations([]);
                        setSelectedIds([]);
                    }
                });

                return () => { unsubscribeAuth(); if (unsubscribeData) unsubscribeData(); };
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!formData.name.trim()) { setErrorMsg('กรุณากรอก "ชื่อ - นามสกุล" ด้วยครับ'); return; }
                if (!formData.company.trim()) { setErrorMsg('กรุณากรอก "บริษัท / หน่วยงาน" ด้วยครับ'); return; }
                if (!formData.phone.trim()) { setErrorMsg('กรุณากรอก "เบอร์โทรศัพท์" ด้วยครับ'); return; }

                if (ENABLE_FOOD_SELECTION && formData.attendance === 'เข้าร่วม') {
                    if (!formData.foodMenu.trim()) { setErrorMsg('กรุณาเลือกเครื่องดื่ม 1 อย่างครับ\n(สามารถกดปุ่มเลือกเมนูเพื่อดูรายการเครื่องดื่มได้เลยครับ)'); return; }
                    if (!formData.acceptedTerms) { setErrorMsg('กรุณาติ๊กเครื่องหมายถูกที่ช่อง "รับทราบและยอมรับเงื่อนไข" ก่อนกดยืนยันครับ'); return; }
                }

                setLoading(true);
                setErrorMsg('');
                
                // ตรวจสอบเบอร์โทรซ้ำ
                const normalizedPhone = formData.phone.replace(/[\s-]/g, '');
                if (!/^\d{9,10}$/.test(normalizedPhone)) {
                    setErrorMsg('กรุณาระบุเบอร์โทรศัพท์ให้ถูกต้อง (ตัวเลข 9-10 หลัก)');
                    setLoading(false);
                    return;
                }

                try {
                    const db = firebase.firestore();
                    const registrationDocId = `${EVENT_ID}_${normalizedPhone}`;
                    const docCheck = await db.collection('registrations').doc(registrationDocId).get();
                    
                    if (docCheck.exists) {
                        setErrorMsg('เบอร์โทรศัพท์นี้ถูกใช้ลงทะเบียนไปแล้วครับ');
                        setLoading(false);
                        return;
                    }

                    await db.collection('registrations').doc(registrationDocId).set({
                        eventId: EVENT_ID,
                        ...formData,
                        name: formData.name.trim(),
                        company: formData.company.trim(),
                        phone: formData.phone.trim(),
                        email: formData.email.trim(),
                        normalizedPhone: normalizedPhone,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // เก็บข้อมูลใบยืนยันในหน้าจอหลังบันทึกสำเร็จเท่านั้น (ไม่สร้างข้อมูลเพิ่มในฐานข้อมูล)
                    setRegistrationReceipt({
                        name: formData.name.trim(),
                        attendance: formData.attendance,
                        drink: formData.attendance === 'เข้าร่วม' ? formData.foodMenu.trim() : ''
                    });
                    setView('success');
                    setFormData({ name: '', nickname: '', company: '', email: '', phone: '', attendance: 'เข้าร่วม', foodMenu: '', acceptedTerms: false });
                } catch (err) { 
                    setErrorMsg("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง: " + err.message); 
                }
                setLoading(false);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoading(true); setErrorMsg('');
                try {
                    const loginEmail = username.includes('@') ? username : `${username}@ppp.com`;
                    await firebase.auth().signInWithEmailAndPassword(loginEmail, password);
                } catch (err) { setErrorMsg("ข้อมูลไม่ถูกต้อง"); }
                setLoading(false);
            };

            const handleLogout = async () => {
                try {
                    await firebase.auth().signOut();
                    setView('landing'); 
                    setUsername(''); 
                    setPassword('');
                    setErrorMsg('');
                    setSelectedIds([]);
                    setSearchTerm('');
                    await firebase.auth().signInAnonymously(); 
                } catch (err) { console.error("Logout Error:", err); }
            };

            const handleDelete = async (id) => {
                if (window.confirm("คุณต้องการลบข้อมูลผู้ลงทะเบียนรายนี้ใช่หรือไม่?")) {
                    try { await firebase.firestore().collection('registrations').doc(id).delete(); } 
                    catch (err) { alert("ลบข้อมูลไม่สำเร็จ: " + err.message); }
                }
            };
            
            const handleSelectAll = (e) => {
                const filtered = registrations.filter(r => r.name?.toLowerCase().includes(searchTerm.toLowerCase()) || r.phone?.includes(searchTerm));
                if (e.target.checked) setSelectedIds(filtered.map(r => r.id));
                else setSelectedIds([]);

                                                        <div className="font-extrabold text-slate-800 text-base flex items-center gap-2">
                                                            {r.name} 
                                                            {r.nickname && <span className="px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] rounded-md font-bold">"{r.nickname}"</span>}
                                                        </div>
                                                        <div className="text-xs font-medium text-slate-500 mt-1 flex items-center gap-1">
                                                            <span className="text-[10px]">🏢</span> {r.company}
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                                                            <span className="text-xs opacity-50">📞</span> {r.phone}
                                                        </div>
                                                        <div className="text-xs font-medium text-slate-500 mt-1 flex items-center gap-1.5">
                                                            <span className="text-xs opacity-50">✉️</span> {r.email || '-'}
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-4 text-center align-top pt-5">
                                                        <span className={`inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-extrabold border ${r.attendance === 'เข้าร่วม' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                                                            {r.attendance === 'เข้าร่วม' ? '✅ เข้าร่วม' : '❌ ไม่ร่วม'}
                                                        </span>
                                                    </td>
                                                    <td className="py-4 px-4 align-top pt-5">
                                                        {r.attendance === 'เข้าร่วม' ? (
                                                            <div className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 inline-block max-w-[200px] truncate" title={r.foodMenu}>
                                                                🥤 {r.foodMenu || '-'}
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-300 font-bold">-</span>
                                                        )}
                                                    </td>
                                                    <td className="py-4 pr-6 pl-4 text-right align-top pt-4">
                                                        <button onClick={() => handleDelete(r.id)} className="w-8 h-8 inline-flex items-center justify-center rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600 transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" title="ลบรายชื่อนี้">
                                                            🗑️
                                                        </button>
                                                    </td>
                                                </tr>
                                            )) : (
                                                <tr>
                                                    <td colSpan="6" className="py-16 text-center text-slate-400">
                                                        <div className="text-4xl mb-3 opacity-20">🔍</div>
                                                        <p className="font-bold text-slate-500">ไม่พบข้อมูลที่ค้นหา</p>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 text-[11px] font-bold text-slate-500 flex justify-between items-center">
                                    <span>แสดงข้อมูลทั้งหมด {filteredRecords.length} รายการ</span>
                                    <span className="uppercase tracking-widest flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Real-time Sync
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
