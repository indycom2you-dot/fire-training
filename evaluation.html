    <style>
        :root { --forest:#0d5b44; --emerald:#148363; --gold:#c69a45; --cream:#faf8f1; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--cream); color:#18372d; }
        .premium-form-bg {
            position:relative; isolation:isolate;
            background:radial-gradient(circle at 8% 8%, rgba(213,180,108,.19), transparent 36%),
                       radial-gradient(circle at 94% 30%, rgba(75,154,125,.18), transparent 37%), #f8f8f2;
        }
        .premium-form-bg:before, .premium-form-bg:after {
            content:''; position:absolute; z-index:-1; border-radius:100%; filter:blur(65px); pointer-events:none;

        .premium-form-bg:after { width:260px; height:260px; background:rgba(204,161,74,.15); bottom:4%; right:-110px; }

        .premium-rule { background:linear-gradient(90deg,transparent,#d3b576 28%,#6eb49b 72%,transparent);height:2px; }
        .progress-track {background:#e7ede7;height:10px;overflow:hidden;border-radius:99px;}
        .progress-fill {background:linear-gradient(95deg,#128161,#58b18b 70%,#cda954);height:100%;border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1);}

        .rating-card:hover {border-color:#b9d8c7;box-shadow:0 10px 30px rgba(15,89,64,.065);}
        .rating-card.is-answered {border-color:#a3cbb3;}
        .rating-option {min-width:0;min-height:72px;background:#f7f9f5;border:1.5px solid #e0e9df;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#657a70;transition:transform .16s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;}
        .rating-option:hover {transform:translateY(-3px);background:#eff8f1;border-color:#9ecdb8;}
        .rating-option:focus-visible {outline:3px solid #b7d6a2;outline-offset:2px;}
        .rating-option.selected {background:linear-gradient(145deg,#0e7558,#128f68);border-color:#0c7555;color:white;box-shadow:0 8px 18px rgba(6,110,75,.22);transform:translateY(-2px);}
        .rating-option.selected .score-emoji {filter:drop-shadow(0 2px 2px rgba(0,0,0,.07));transform:scale(1.08);}

        .premium-submit {background:linear-gradient(105deg,#07533d,#118565 65%,#198f6c);box-shadow:0 12px 24px rgba(16,106,76,.22);transition:transform .18s,box-shadow .18s,filter .18s;position:relative;overflow:hidden;}
        .premium-submit:hover:not(:disabled) {transform:translateY(-2px);box-shadow:0 15px 30px rgba(16,106,76,.28);filter:saturate(1.1);}
        .premium-submit:disabled {opacity:.7;cursor:wait;}
        .premium-submit:after {content:'';position:absolute;top:0;bottom:0;width:70px;left:-80px;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);}
        .premium-submit:hover:after {animation:glide 1s ease-out;}
        .success-mark {animation:pop-in .65s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 12px 25px rgba(18,126,89,.18);}
        .success-halo {background:radial-gradient(circle,rgba(221,198,137,.35),rgba(131,197,157,.11) 60%,transparent 72%);}
        .sparkle {position:absolute;font-size:20px;animation:floaty 3.2s ease-in-out infinite;}
        .admin-gradient { background:linear-gradient(135deg,#0d5945,#092f26); }
        .chart-container { position:relative; width:100%; height:280px; background:white; border-radius:16px; }
        .premium-admin {background:#f6f8f4;}
        .premium-admin .stats-grid > div {box-shadow:0 4px 20px rgba(16,73,51,.04);border:1px solid #dfe9df;transition:transform .2s,box-shadow .2s;}
        .premium-admin .stats-grid > div:hover {transform:translateY(-2px);box-shadow:0 12px 25px rgba(20,84,62,.08);}
        .premium-admin .admin-panel {box-shadow:0 8px 27px rgba(18,79,54,.045);border:1px solid #dfe8df;}
        @keyframes soft-rise {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop-in {0%{opacity:0;transform:scale(.55) rotate(-13deg)}80%{transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
        @keyframes floaty {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes glide {to{left:110%}}
        ::-webkit-scrollbar {width:7px;height:7px;} ::-webkit-scrollbar-thumb{background:#abcabc;border-radius:10px;}
        @media (max-width:390px){.rating-card{padding:14px}.rating-option{min-height:63px;border-radius:13px}.score-emoji{font-size:21px}}
        @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ExcelJS & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script type="text/babel">
        // รหัสเชื่อมต่อ FIREBASE ของคุณอภิชิต
        const firebaseConfig = {
            apiKey: "AIzaSyC9-6NepYeoyU4-pluImdIcNBV6H7ThLas",
            authDomain: "ppp-registration.firebaseapp.com",
            projectId: "ppp-registration",
            storageBucket: "ppp-registration.firebasestorage.app",
            messagingSenderId: "1072711188640",
            appId: "1:1072711188640:web:e639ef36b32ea637ab09c5",
            measurementId: "G-Z0XFPK8CJ7"
        };

        const EVENT_ID = "ppp-seminar-2026-11-11";
        const COVER_IMAGE = "./cover.png";

        const SCORE_CHOICES = [
            {score:1, emoji:'😟', label:'ควรปรับปรุง'},
            {score:2, emoji:'😕', label:'พอใช้'},
            {score:3, emoji:'😐', label:'ปานกลาง'},
            {score:4, emoji:'😊', label:'ดีมาก'},
            {score:5, emoji:'🤩', label:'ดีเยี่ยม'}
        ];

        const RatingRow = ({ number, icon, label, value, onChange }) => (
            <section className={`rating-card ${value ? 'is-answered' : ''}`} style={{animationDelay:`${(number - 1) * 70}ms`}}>
                <div className="flex items-start gap-3 mb-4">
                    <div className="w-10 h-10 shrink-0 rounded-xl bg-emerald-50 text-emerald-800 flex items-center justify-center text-xl" aria-hidden="true">{icon}</div>
                    <div className="flex-1 min-w-0">
                        <div className="text-[11px] font-bold text-emerald-700 tracking-wide mb-0.5">หัวข้อที่ {number} / 4</div>
                        <h3 className="text-[15px] sm:text-base font-bold text-slate-800 leading-relaxed" id={`score-label-${number}`}>{label}</h3>
                    </div>
                    {value > 0 && <span className="text-emerald-700 text-xl font-bold" aria-label="ตอบแล้ว">✓</span>}
                </div>
                <div className="grid grid-cols-5 gap-2" role="group" aria-labelledby={`score-label-${number}`}>
                    {SCORE_CHOICES.map(choice => (
                        <button type="button" key={choice.score}
                            aria-label={`${choice.score} คะแนน ${choice.label}`}
                            aria-pressed={value === choice.score}
                            onClick={() => onChange(choice.score)}
                            className={`rating-option ${value === choice.score ? 'selected' : ''}`}>
                            <span className="score-emoji" aria-hidden="true">{choice.emoji}</span>
                            <span className="score-digit">{choice.score}</span>
                        </button>
                    ))}
                </div>
                <div className="flex items-center justify-between gap-3 mt-3 min-h-[22px] text-xs" aria-live="polite">
                    <span className="text-slate-400">1 = ควรปรับปรุง</span>
                    <span className={`font-bold ${value ? 'text-emerald-700' : 'text-slate-400'}`}>
                        {value ? `${value}/5 · ${SCORE_CHOICES[value-1].label}` : 'แตะเลือกคะแนน'}
                    </span>
                </div>
            </section>
        );

        const App = () => {
            const [view, setView] = React.useState('form'); 
            const [user, setUser] = React.useState(null);
            const [evaluations, setEvaluations] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [submitted, setSubmitted] = React.useState(false);
            const [errorMsg, setErrorMsg] = React.useState(''); 
            const [searchTerm, setSearchTerm] = React.useState('');
            
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');

            // ฟอร์มเก็บข้อมูลแบบประเมิน
            const [formData, setFormData] = React.useState({ 
                name: '', scoreContent: 0, scoreSpeaker: 0, scoreVenue: 0, scoreOverall: 0, suggestion: '' 
            });

            const answeredCount = ['scoreContent','scoreSpeaker','scoreVenue','scoreOverall']
                .filter(key => Number(formData[key]) >= 1).length;
            const progressPercent = Math.round((answeredCount / 4) * 100);
            const updateScore = (field, score) => {
                setFormData(prev => ({...prev, [field]:score}));
                if (errorMsg) setErrorMsg('');
            };

            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();
                const db = firebase.firestore();

                const initAuth = async () => {
                    if (!auth.currentUser) {
                        try { await auth.signInAnonymously(); } catch(e) { console.error("Auth init error:", e); }
                    }
                };
                initAuth();

                let unsubscribeData = null;

                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (unsubscribeData) { unsubscribeData(); unsubscribeData = null; }
                    if (u && !u.isAnonymous) {
                        setView('admin');
                        // ใช้ Collection 'evaluations' เพื่อแยกข้อมูลออกจากรายชื่อลงทะเบียน
                        unsubscribeData = db.collection('evaluations')
                            .onSnapshot((snapshot) => {
                                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(r => r.eventId === EVENT_ID);
                                items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                                setEvaluations(items);
                            }, (error) => {
                                console.error("Firestore Error:", error);
                                if (error.message.includes('permission')) setErrorMsg("ติดปัญหา Permission: กรุณาเช็ค Firebase Rules");
                            });
                    } else { setEvaluations([]); }
                });

                return () => { unsubscribeAuth(); if (unsubscribeData) unsubscribeData(); };
            }, []);

            // วาดกราฟสรุปคะแนนเฉลี่ย
            React.useEffect(() => {
                if (view === 'admin' && chartRef.current && evaluations.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();

                    const calcAvg = (key) => (evaluations.reduce((sum, ev) => sum + ev[key], 0) / evaluations.length).toFixed(2);
                    const averages = [calcAvg('scoreContent'), calcAvg('scoreSpeaker'), calcAvg('scoreVenue'), calcAvg('scoreOverall')];

                    const ctx = chartRef.current.getContext('2d');
                    
                    const createGradient = (color1, color2) => {
                        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                        gradient.addColorStop(0, color1);
                        gradient.addColorStop(1, color2);
                        return gradient;
                    };

                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['📚 เนื้อหา', '🎤 วิทยากร', '🏢 สถานที่/การจัดงาน', '⭐ ภาพรวม'],
                            datasets: [{
                                label: 'คะแนนเฉลี่ย',
                                data: averages,
                                backgroundColor: [
                                    createGradient('#148363', '#91d0b0'), // Emerald
                                    createGradient('#b48c38', '#f0dba0'), // Gold
                                    createGradient('#789b88', '#d1dfd1'), // Sage
                                    createGradient('#0d5b44', '#52b895')  // Forest
                                ],
                                borderRadius: 12,
                                borderSkipped: false,
                                barPercentage: 0.6 
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: {
                                onComplete: function() {
                                    const ctx = this.ctx;
                                    ctx.save();
                                    ctx.globalCompositeOperation = 'destination-over';
                                    ctx.fillStyle = 'white';
                                    ctx.fillRect(0, 0, this.width, this.height);
                                    ctx.restore();
                                }
                            },
                            scales: {
                                y: { beginAtZero: true, max: 5, grid: { color: '#f1f5f9', drawBorder: false }, ticks: { font: { weight: 'bold', size: 14 } } },
                                x: { grid: { display: false }, ticks: { font: { family: "'Sarabun', sans-serif", weight: 'bold', size: 14 } } }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: { 
                                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                    padding: 12,
                                    cornerRadius: 8,
                                    callbacks: { label: (ctx) => ` เฉลี่ย: ${ctx.raw} / 5.0` },
                                    bodyFont: { family: "'Sarabun', sans-serif", size: 14 }
                                }
                            }
                        }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [view, evaluations]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                try {
                    const loginEmail = username.includes('@') ? username : `${username}@ppp.com`;
                    await firebase.auth().signInWithEmailAndPassword(loginEmail, password);
                } catch (err) { setErrorMsg("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้องครับ"); }
                setLoading(false);
            };

            const handleLogout = async () => {
                try {
                    await firebase.auth().signOut();
                    setView('form'); setSubmitted(false); setUsername(''); setPassword(''); setErrorMsg(''); setSearchTerm('');
                } catch (err) { console.error("Logout Error:", err); }
            };

            const handleSubmitEvaluation = async (e) => {
                e.preventDefault();
                if (!formData.scoreContent || !formData.scoreSpeaker || !formData.scoreVenue || !formData.scoreOverall) {
                    setErrorMsg('กรุณาให้คะแนนให้ครบทุกหัวข้อ (ข้อ 1-4) ครับ'); 
                    return;
                }
                setLoading(true); setErrorMsg('');
                try {
                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    if (!auth.currentUser) await auth.signInAnonymously();
                    await db.collection('evaluations').add({ ...formData, eventId: EVENT_ID, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    setSubmitted(true);
                    setFormData({ name: '', scoreContent: 0, scoreSpeaker: 0, scoreVenue: 0, scoreOverall: 0, suggestion: '' });
                    window.scrollTo({top:0, behavior:'smooth'});
                } catch (err) { setErrorMsg("เกิดข้อผิดพลาด: " + err.message); }
                setLoading(false);
            };

            const handleDelete = async (id) => {
                if (window.confirm("ต้องการลบข้อมูลแบบประเมินนี้ใช่หรือไม่?")) {
                    try { await firebase.firestore().collection('evaluations').doc(id).delete(); } 
                    catch (err) { alert("ลบข้อมูลไม่สำเร็จ: " + err.message); }
                }
            };

            const exportExcel = async () => {
                const workbook = new ExcelJS.Workbook();
                const totalEvals = evaluations.length;
                if(totalEvals === 0) { alert("ไม่มีข้อมูลให้ Export ครับ"); return; }

                const calcAvg = (key) => (evaluations.reduce((sum, ev) => sum + ev[key], 0) / totalEvals).toFixed(2);
                const avgOverall = calcAvg('scoreOverall');

                const getMeaning = (val) => {
                    if(val >= 4.5) return 'ดีเยี่ยม';
                    if(val >= 3.5) return 'ดีมาก';
                    if(val >= 2.5) return 'ปานกลาง';
                    return 'ควรปรับปรุง';
                };

                const getStars = (val) => {
                    const count = Math.round(val);
                    return '⭐'.repeat(count) + '⚪'.repeat(5 - count);
                };

                // ==========================================
                // SHEET 1: EXECUTIVE DASHBOARD
                // ==========================================
                const dashSheet = workbook.addWorksheet('📊 Executive Dashboard', { views: [{ showGridLines: false }] });
                dashSheet.properties.defaultRowHeight = 25;
                dashSheet.columns = [
                    { width: 3 }, { width: 38 }, { width: 40 }, { width: 25 }, { width: 60 }, { width: 3 }
                ];

                dashSheet.mergeCells('B2:E3');
                const dashTitle = dashSheet.getCell('B2');
                dashTitle.value = 'รายงานสรุปผลประเมิน: ' + 'เลือกซ่อมรถอย่างไร ให้เข้าใจทั้งอู่ ทั้งอะไหล่ และคุณภาพงานซ่อม';
                dashTitle.font = { name: 'Sarabun', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
                dashTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0D5B44' } }; 
                dashTitle.alignment = { vertical: 'middle', horizontal: 'center' };

                dashSheet.mergeCells('B4:E4');
                const printDate = dashSheet.getCell('B4');
                printDate.value = `ข้อมูลอัปเดตล่าสุด ณ วันที่: ${new Date().toLocaleString('th-TH')} | จัดทำโดย: บริษัท พีพีพี อินชัวรันส์ โบรคเกอร์ จำกัด`;
                printDate.font = { name: 'Sarabun', size: 10, italic: true, color: { argb: 'FF64748B' } };
                printDate.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };
                printDate.alignment = { vertical: 'middle', horizontal: 'right', indent: 1 };

                // KPI Boxes
                dashSheet.mergeCells('B6:C8');
                const kpi1 = dashSheet.getCell('B6');
                kpi1.value = `👥 จำนวนผู้ให้คะแนนประเมิน\n\n${totalEvals} ท่าน`;
                kpi1.font = { name: 'Sarabun', size: 16, bold: true, color: { argb: 'FF1E293B' } };
                kpi1.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
                kpi1.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                kpi1.border = { top: {style:'thin', color:{argb:'FFCBD5E1'}}, left: {style:'thin', color:{argb:'FFCBD5E1'}}, bottom: {style:'thick', color:{argb:'FF168363'}}, right: {style:'thin', color:{argb:'FFCBD5E1'}} };

                dashSheet.mergeCells('D6:E8');
                const kpi2 = dashSheet.getCell('D6');
                kpi2.value = `⭐ คะแนนความพึงพอใจโดยรวม\n\n${avgOverall} / 5.0 (${getMeaning(avgOverall)})`;
                kpi2.font = { name: 'Sarabun', size: 16, bold: true, color: { argb: 'FF15803D' } };
                kpi2.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0FDF4' } };
                kpi2.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                kpi2.border = { top: {style:'thin', color:{argb:'FF86EFAC'}}, left: {style:'thin', color:{argb:'FF86EFAC'}}, bottom: {style:'thick', color:{argb:'FF16A34A'}}, right: {style:'thin', color:{argb:'FF86EFAC'}} };

                dashSheet.mergeCells('B10:C10');
                dashSheet.getCell('B10').value = '📈 กราฟวิเคราะห์ภาพรวมและแยกหัวข้อ';
                dashSheet.getCell('B10').font = { name: 'Sarabun', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
                dashSheet.getCell('B10').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF475569' } };
                dashSheet.getCell('B10').alignment = { vertical: 'middle', horizontal: 'center' };

                dashSheet.mergeCells('D10:E10');
                dashSheet.getCell('D10').value = '📝 5 ข้อเสนอแนะล่าสุด';
                dashSheet.getCell('D10').font = { name: 'Sarabun', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };

                                </div>
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-amber-50 flex flex-col justify-between">
                                    <div className="w-12 h-12 bg-amber-50 text-amber-700 rounded-2xl flex items-center justify-center text-2xl mb-4">🎤</div>
                                    <div>
                                        <p className="text-[10px] md:text-xs font-extrabold text-amber-500 uppercase tracking-widest mb-1">วิทยากร / สถานที่</p>
                                        <div className="flex items-baseline gap-1"><span className="text-3xl md:text-4xl font-black text-slate-800">{((parseFloat(calcAvg('scoreSpeaker')) + parseFloat(calcAvg('scoreVenue')))/2).toFixed(2)}</span><span className="text-xs text-slate-400 font-bold">/ 5</span></div>
                                    </div>
                                </div>
                            </div>

                            {/* Chart Card */}
                            <div className="admin-panel bg-white rounded-[24px] p-6 md:p-8 mb-8">
                                <h3 className="text-sm font-extrabold text-emerald-950 uppercase tracking-widest mb-6 flex items-center gap-2">
                                    <span className="text-lg">📊</span> กราฟวิเคราะห์คะแนนเฉลี่ยรายหัวข้อ
                                </h3>
                                {evaluations.length > 0 ? (
                                    <div className="chart-container"><canvas ref={chartRef}></canvas></div>
                                ) : (
                                    <div className="h-[280px] flex items-center justify-center text-slate-400 font-bold bg-slate-50 rounded-2xl border border-dashed border-slate-200">ยังไม่มีข้อมูลสำหรับสร้างกราฟ</div>
                                )}
                            </div>

                            {/* Search & Feedback Table */}
                            <div className="admin-panel bg-white rounded-[24px] overflow-hidden mb-12">
                                <div className="p-5 md:p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50">
                                    <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-widest flex items-center gap-2 w-full md:w-auto">
                                        <span className="text-lg">💬</span> ข้อเสนอแนะจากผู้เข้าอบรม
                                    </h3>
                                    <div className="relative w-full md:w-[350px]">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
                                        <input 
                                            type="text" 
                                            placeholder="ค้นหาชื่อ หรือ ข้อเสนอแนะ..." 
                                            className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all shadow-sm"
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                        />
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse whitespace-nowrap md:whitespace-normal">
                                        <thead className="bg-white border-b border-slate-200">
                                            <tr>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">ผู้ให้คะแนน</th>
                                                <th className="py-4 px-4 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">เนื้อหา</th>
                                                <th className="py-4 px-4 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">วิทยากร</th>
                                                <th className="py-4 px-4 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">สถานที่</th>
                                                <th className="py-4 px-4 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-center">ภาพรวม</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">ข้อเสนอแนะ</th>
                                                <th className="py-4 px-6 text-[11px] font-extrabold text-slate-400 uppercase tracking-wider text-right">จัดการ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredRecords.map(r => (
                                                <tr key={r.id} className="hover:bg-slate-50 transition-colors group">
                                                    <td className="py-4 px-6 font-bold text-sm text-slate-800">{r.name || <span className="text-slate-400 italic font-medium">ไม่ประสงค์ออกนาม</span>}</td>
                                                    <td className="py-4 px-4 text-center font-black text-emerald-600">{r.scoreContent}</td>
                                                    <td className="py-4 px-4 text-center font-black text-amber-500">{r.scoreSpeaker}</td>
                                                    <td className="py-4 px-4 text-center font-black text-amber-700">{r.scoreVenue}</td>
                                                    <td className="py-4 px-4 text-center"><span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-black">{r.scoreOverall}</span></td>
                                                    <td className="py-4 px-6 text-sm text-slate-600 font-medium min-w-[200px]">{r.suggestion || <span className="text-slate-300">-</span>}</td>
                                                    <td className="py-4 px-6 text-right">
                                                        <button onClick={() => handleDelete(r.id)} className="w-8 h-8 inline-flex items-center justify-center rounded-lg text-slate-300 hover:bg-emerald-100 hover:text-emerald-700 transition-all opacity-0 group-hover:opacity-100">
                                                            🗑️
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredRecords.length === 0 && (
                                                <tr><td colSpan="7" className="py-16 text-center text-slate-400 font-bold bg-slate-50/50">ไม่พบข้อมูลที่ค้นหา</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
